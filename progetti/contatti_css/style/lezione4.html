<body>
    <!--
    La proprietà display e la proprietà position
    Il display consente di alterare la natura dell'elemento rispetto a come si comporta nei confronti di ciò
    che è al suo esterno
    Position consente di alterare il posizionamento dell'elemento rispetto al suo punto di origine
    DISPLAY
    display bloc: l'elemento o gli elementi si spingono uno sotto l'altro
    display inline: l'elemento o gli elementi si dispongono in linea l'uno di fianco all'altro
    display inline-block: come inline, ma possono accettare valori di altezza e larghezza
    display none: ci consente di non mostrare un elemento o degli elementi all'interno della
    visibility: show | hidden
    -->
</body>
