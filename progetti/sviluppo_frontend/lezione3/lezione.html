<!--
    PSEUDOCLASSI

    Sono dei selettori che permettono di puntare a degli elementi html quando
    essi si trovano in un determinato stato.

    :hover -> permette di creare uno stile personalizzato soltanto quando il
    cursore si trova sopra l'elemento o gli che elementi che appartengono ad 
    una determinata classe o tipo.

    :active -> permette di creare uno stile agli elementi che in questo momento
    sono sotto il click

    :focus -> dedicato particolarmente agli input. Consente di personalizzare
    lo stile nei campi quando si itende scrivere al loro interno
    
    :link -> lo stato di default dei tag <a></a>

    :visited -> lo stato visitato dei tag a

    :first-child (last child) -> modifica lo stile esclusivamente del primo(ultimo)
    figlio del container padre

    :nth-child(n) -> permette di modificare lo stile dell'elemento ennesimo
    del container padre
        even | odd -> puntare a tutti gli elementi pari o dispari del container padre
    
    Quando stiamo modificando lo stato di un elemento con la pseudoclasse
    assicuriamoci sempre che il suo stato base si trovi nello stesso
    criterio di implementazione.

    FLEXBOX - Modello CSS per l'organizzazione degli elementi figli all'interno
    di un container padre. Dobbiamo tener conto qual è l'asse di riferimento.
    Il Main-axis e il Cross-axis determinano l'orientamento degli elementi
    all'interno del container padre.
    La proprietà che attiva questo modello è display:flex; che deve essere
    NECESSARIAMENTE assegnata al padre.
    Una volta assegnata la proprietà display:flex, di default il main-axis
    è l'asse delle ascisse X, quindi di contro il cross-axis è l'asse delle
    ordinate Y. Per invertire l'asse di riferimento si usa la proprietà
    flex-direction.
    Possiamo attribuire a flex-direction i seguenti valori: row | column | row-reverse | column-reverse
    Contrasto: più si è vicini a 5 meglio è su adobe colors
    per i font bisogna creare una cartella e inserire il font scaricato
    <style>
        @font-face {
            font-family: 'nomeDelFont'
            src: url('fonts/nomefont') format('opentype');
        }
        p {
            font-family: 'nomeDelFont';
        }
    </style>

    Icona che compare di fianco al nome della scheda
    <link rel"icon" type="image/png" href="path"/>

    Media-query sono degli strumenti che ci consentono di rendere
    responsive il sito/pagina-web
    @media screen and (min-width:valorepx)(max-width:valorepx)
    i breakpoint sono delle dimensioni specifiche universali da
    attribuire alle proprietà min/max-width all'interno della 
    descrizione del media-query.
    min-width: significa a partire dalla dimensione di questo
    dispositivo in poi
    max-width fino a dimensione di questo dispositivo
    Con i media-query possiamo creare dei sottostili in base
    alle dimensioni dei dispositivi
    -->

<!DOCTYPE html>
<html lang="it">

<head>
    <link rel="icon" type="image/png" href="immagine.avif"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #cambiaColore {
            background-color: green;
            width: 100px;
            height: 100px;
            box-shadow: 4px 3px 10px 5px black;
        }

        #cambiaColore2 {
            background-color: whitesmoke;
            width: 100px;
            height: 100px;
            box-shadow: 4px 3px 10px 5px black;
        }

        #cambiaColore3 {
            background-color: red;
            width: 100px;
            height: 100px;
            box-shadow: 4px 3px 10px 5px black;
        }

        #cambiaColore:hover {
            background-color: blue;
        }

        #cambiaColore2:hover {
            background-color: blue;
        }

        #cambiaColore3:hover {
            background-color: blue;
        }

        #pulsante {
            background-color: blue;
            width: 150px;
            height: 80px;
        }

        #pulsante:active {
            background-color: red;
        }

        #link:link {
            text-decoration: none;
            color: green;
        }

        #link:visited {
            text-decoration: underline;
            color: blue;
        }

        nav {
            background-color: lightblue;
            height: 40px;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            height: 40px;
        }

        #wrapper_nonno {
            width: 100%;
            background-color: brown;
            display: flex;
            justify-content: center;
        }

        #wrapper {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            height: 300px;
            width: 500px;
            align-items: center;
            background-color: lightgreen;
        }

        #sposta {
            width: 100px;
            height: 100px;
            background-color: red;
            transition: 0.5s ease;
        }

        #sposta:hover {
            background-color: blue;
            border-radius: 25px;
            transform: scale(1.3);
        }
    </style>
</head>
<!--
ease transizione smooth
ease-in comincia rapidamente e finisce lentamente
ease-out comincia lentamente e finisce velocemente
ease-in-out curva gaussiano, l'inizio è accelerato
poi rallenta, di seguito torna veloce   
transform permette di trasformare l'elemento
-->
<body>
    <nav>
        <ul>
            <li><a href="#">Link1</a></li>
            <li><a href="#">Link2</a></li>
            <li><a href="#">Link3</a></li>
        </ul>
    </nav>
    <br />
    <div id="cambiaColore"></div>
    <br />
    <button id="pulsante">Cliccami</button>
    <a id="link" href="#">Link default</a>
    <br /><br />
    <div id="wrapper_nonno">
        <div id="wrapper">
            <div id="cambiaColore"></div>
            <div id="cambiaColore2"></div>
            <div id="cambiaColore3"></div>
        </div>
    </div>

    <br/>
    <div id="sposta"></div>

</body>

</html>
