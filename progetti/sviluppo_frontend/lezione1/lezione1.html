<!DOCTYPE html> <!-- Definisce la versione HTML ovvero HTML5 -->
<html lang="it"> 
    <!-- 
        Definisce il tipo di documento e la lingua. Se la lingua è diversa da quella utilizzata
        il browser mostrerà una finestra di dialogo dove chiederà all'utente se vuole tradurre la pagina nella sua
        lingua 
    -->
    <head> 
        <!-- 
            Rappresenta la testata del documento
            Qui vengono inseriti tutti i collegamenti ipertestuali (statici) e (dinamic).
            Quelli statici vengono inseriti con il tag <link/>
            Quelli dinamici vengono inseriti con il tag <script>
            Questa parte rappresenta una porzione non visibile da parte dell'utente. Contiene anche istruzioni e 
            informazioni utili come la codifica dei caratteri disponibili che possiamo utilizzare e altri meta-tag
            Contiene il <title> ovvero il nome del documento
        -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    </head>
    <body>
        <!--
            Il body rappresenta tutta la parte visibile del documento e può contenere tag di diverso tipo.
            Mentre l'head può contenere collegamenti ipertestuali con i tag <link>, il body può creare collegamenti ipertestuali
            con i tag <a></a> ovvero gli anchor point.
        -->
        Ciao forciazzi
    </body>
</html>
