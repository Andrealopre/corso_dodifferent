<!--
BOOTSTRAP

Bootstrap è un framework frontend che si basa sui linguaggi html, css e javascript. E' open source e serve a sviluppare
velocemente interfacce lato web/client.

Bootstrap si avvale di un file css molto pesante, dove sono presenti
tutte le classi preconfigurate e delle variabili css che vengono 
riutilizzate da classi e componenti dello stesso framework. Ha quindi
un approccio monolitico.

Bootstrap funziona con un sistema a griglia composto da righe e 
colonne. Le righe sono potenzialmente infinite mentre sono le colonne
sono fissate a massimo 12 (il 100% del body corrisponde a 12 colonne
bootstrap).
Con la classe "col1", "col2" etc. si possono definire le larghezze
delle colonne. Solitamente le colonne sono inserite in wrapper che
rappresentano le singole righe.

Per poter definire la larghezza di un elemento si attribuisce dunque la classe "col-{numero}" che rappresenta il numero
di colonne occupate.
Se ci sono più elementi che devono occupare su una stessa riga un determinato spazio, bisogna assicurarsi che la somma
di tutto lo spazio occupato dagli elementi non super mai le 12 colonne.

Gli elementi che hanno una dimensione definita in larghezza possono essere a loro volta suddivisi in 12 colonne, quindi
i figli possono occupare un max di 12 colonne relativamente alla dimensione definita dal padre.
Per poter cambiare la proprietà attribuita all'elemento attraverso una classe di bootstrap per un dispositivo specifico
si usa la combinazione "{nome_classe}-{suffisso_breakpoint}-{valore_proprietà}" (eg. "col-sm-3") stiamo definendo
quanto misura ma su quale dispositivo (media query + css)
-->
