<h3>{{ title }} <button (click)="azzeraCarrello()">Pulisci carrello</button></h3>
<table>

    <tr>
        <td>{{ prodotto.prodotto }}</td>
        <td>{{ prodotto.prezzo }} €</td>
    </tr>
    }
</table>
